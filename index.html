<head>

<style>
/* Concept : tableau de bord d'installation, une colonne, barre d'onglets en bas.
   Palette : neutres bleutés, séries issues de la palette validée (bleu, orange, aqua). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#10161d; --ink2:#46515d; --muted:#66717e;
  --hair:#dfe4ea; --soft:#eaeef3; --accent:#1f3a5f; --accent-ink:#ffffff;
  --c-conso:#2a78d6; --c-prod:#eb6834; --c-solar:#1baf7a;
  --good:#006300; --warn-bg:#fff3d6; --warn-ink:#6b4a00; --bad:#b3261e;
  --f-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1216; --surface:#161b21; --ink:#eef1f4; --ink2:#b4bdc7; --muted:#8d98a4;
  --hair:#262d35; --soft:#1e252d; --accent:#8fb4ee; --accent-ink:#0e1216;
  --c-conso:#3987e5; --c-prod:#d95926; --c-solar:#199e70;
  --good:#0ca30c; --warn-bg:#3a2d0c; --warn-ink:#f2d58a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1216; --surface:#161b21; --ink:#eef1f4; --ink2:#b4bdc7; --muted:#8d98a4;
  --hair:#262d35; --soft:#1e252d; --accent:#8fb4ee; --accent-ink:#0e1216;
  --c-conso:#3987e5; --c-prod:#d95926; --c-solar:#199e70;
  --good:#0ca30c; --warn-bg:#3a2d0c; --warn-ink:#f2d58a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:500}
p{margin:0}
#app{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-direction:column;gap:2px}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.iconbtn{flex:none;width:44px;height:44px;border:1px solid var(--hair);background:var(--surface);color:var(--ink2);border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:disabled{opacity:.5}
.headtools{display:flex;align-items:center;gap:8px;flex:none}
.ver{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sub{color:var(--ink2);font-size:13px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{border:0;background:transparent;padding:0}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mid{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .unit{font-size:13px;color:var(--ink2);font-weight:500}
.tile .hint{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative;height:220px;min-width:0}
.chartbox.tall{height:260px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:600;font-size:14px;padding:9px 10px;border-radius:8px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2>*{flex:1 1 140px;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--hair);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:10px;font-weight:600;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--ink2);font-weight:500}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--hair);border-radius:9px;padding:10px 11px;min-height:44px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.field small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:13px}
.note.info{background:var(--soft);color:var(--ink2)}
.scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;white-space:nowrap;border-bottom:1px solid var(--hair)}
td{padding:8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hair)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr.hl td{background:var(--soft)}
tr[data-act]{cursor:pointer}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c-solar);border-radius:6px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}
.slider{display:flex;flex-direction:column;gap:2px}
.slider .top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);gap:8px}
.slider .top b{color:var(--ink);font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--hair);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;z-index:5}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:48px;border-radius:10px;cursor:pointer;min-width:0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
#upd{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;
  background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;z-index:8}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;
  background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;font-size:14px;z-index:9;text-align:center}
.eq{border-top:1px solid var(--hair);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.eq:first-of-type{border-top:0;padding-top:0}
.good{color:var(--good);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion:no-preference){.card,.tile{transition:border-color .15s}}
.checks{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--hair);min-height:48px}
label.check{justify-content:flex-start;cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.check span{display:flex;flex-direction:column;min-width:0;font-weight:500}
.check small{color:var(--muted);font-size:12px;font-weight:400}
details.add summary{cursor:pointer;font-weight:600;color:var(--accent);padding:8px 0;min-height:40px}
details.add .addbody{display:flex;flex-direction:column;gap:10px;padding-top:4px}
nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note.info.backup{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>

<div id="app"></div>
<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status" hidden></div>
<input type="file" id="imp-file" hidden>

<script>
/* Version affichée dans l'appli : doit rester égale à CACHE_VERSION dans sw.js (vérifié par les tests). */
const APP_VERSION='v9';

/* ---------- utilitaires ---------- */
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const nf=(d)=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});
const N0=nf(0),N1=nf(1),N2=nf(2);
const fmt=(v,d=0)=>nf(d).format(v);
const eur=(v,d=0)=>nf(d).format(v)+' €';
const pc=(v,d=0)=>nf(d).format(v*100)+' %';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const num=s=>{const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:NaN};
const keyOf=(y,m)=>y+'-'+String(m+1).padStart(2,'0');

const DEF={ratio:1402,tauxBase:.40,bonus:.037,plafond:.90,startYear:2025,prix:.1545,abo:19.71,rachat:0,consoGrowth:0,priceGrowth:0};
const TARIFS=[
 ['Jour Bleu, heures creuses',.13254],['Jour Bleu, heures pleines',.16122],
 ['Jour Blanc, heures creuses',.14994],['Jour Blanc, heures pleines',.18714],
 ['Jour Rouge, heures creuses',.1575],['Jour Rouge, heures pleines',.70602]];
/* kWh facturés par option Tempo : données personnelles, rangées dans settings/tempo (pas dans le code) */
const tempoKwh=()=>{const t=S.settings.tempo;return t&&Array.isArray(t.kwh)&&t.kwh.length===TARIFS.length?t.kwh:null};

/* ---------- état ---------- */
const S={months:{},parc:{},settings:{},tab:'accueil',range:12,mview:'graph',scen:null,edit:null,confirmDel:null,
  loaded:{months:false,parc:false,settings:false},err:null};
try{const t=localStorage.getItem('ss-tab');if(t)S.tab=t}catch(e){}
let db=null,charts=[],pending=[];
const cfg=()=>({...DEF,...(S.settings.main||{})});
const scen=()=>{if(!S.scen){const c=cfg();S.scen={priceGrowth:c.priceGrowth,consoGrowth:c.consoGrowth,rachat:c.rachat}}return S.scen};
const parcList=()=>Object.entries(S.parc).map(([id,e])=>({id,...e})).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);

function monthsList(){
  const c=cfg();
  return Object.entries(S.months).map(([k,m])=>({key:k,...m})).sort((a,b)=>a.key<b.key?-1:1).map(m=>({
    ...m,solar:m.conso-m.reseau,taux:m.prod?m.usage/m.prod:0,autos:m.conso?1-m.reseau/m.conso:0,
    cout:m.reseau*c.prix+c.abo-Math.max(0,m.prod-m.usage)*c.rachat}));
}
function last12(ml){return ml.slice(-12)}
function consoBase(ml){
  const l=last12(ml);if(!l.length)return 0;
  const s=l.reduce((a,m)=>a+m.conso,0);return l.length>=12?s:s/l.length*12;
}

/* ---------- modèle de projection : project() est dans model.js (identique au classeur) ---------- */
function scenarioCfg(){return {...cfg(),...scen()}}
function runProject(){
  const ml=monthsList(),c=scenarioCfg();
  return project(parcList(),c,consoBase(ml),c.startYear);
}

/* ---------- graphiques ---------- */
function legendHtml(items){return '<div class="legend">'+items.map(i=>`<span><i style="background:var(${i[1]})"></i>${esc(i[0])}</span>`).join('')+'</div>'}
function chartCard(id,title,items,builder,tall){
  pending.push({id,builder});
  return `<section class="card"><h3>${title}</h3>${items?legendHtml(items):''}<div class="chartbox${tall?' tall':''}"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div></section>`;
}
function flush(){
  charts.forEach(c=>c.destroy());charts=[];
  if(typeof Chart==='undefined'){pending=[];return}
  Chart.defaults.font.family=css('--f-body');Chart.defaults.font.size=11;Chart.defaults.color=css('--muted');
  pending.forEach(p=>{const el=document.getElementById(p.id);if(el){try{charts.push(new Chart(el,p.builder()))}catch(e){console.error(e)}}});
  pending=[];
}
const marksPlugin={id:'marks',afterDatasetsDraw(chart,a,o){
  if(!o||!o.items||!o.items.length)return;
  const {ctx,chartArea:ar,scales:{x}}=chart,step=x.getPixelForValue(1)-x.getPixelForValue(0);
  o.items.forEach(it=>{
    const px=x.getPixelForValue(it.idx)+(it.frac-.5)*step;
    ctx.save();ctx.strokeStyle=css('--ink2');ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(px,ar.top);ctx.lineTo(px,ar.bottom);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=css('--ink2');ctx.font='600 11px '+css('--f-body');
    const left=px<(ar.left+ar.right)/2;ctx.textAlign=left?'left':'right';
    ctx.fillText(it.label,px+(left?5:-5),ar.top+11);ctx.restore();
  });
}};
function baseOpts(o={}){
  const hair=css('--hair'),surf=css('--surface'),ink=css('--ink'),ink2=css('--ink2');
  const yfmt=o.yfmt||(v=>fmt(v));
  return {
    responsive:true,maintainAspectRatio:false,animation:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},
      tooltip:{backgroundColor:surf,titleColor:ink,bodyColor:ink2,borderColor:hair,borderWidth:1,padding:10,
        boxPadding:4,usePointStyle:true,
        callbacks:{label:c=>' '+c.dataset.label+' : '+(o.tipfmt?o.tipfmt(c.parsed.y):yfmt(c.parsed.y)),
          afterBody:o.afterBody||undefined}},
      marks:{items:o.marks||[]}},
    scales:{
      x:{stacked:!!o.stacked,grid:{display:false},border:{color:hair},ticks:{autoSkip:true,maxRotation:0,color:css('--muted')}},
      y:{stacked:!!o.stacked,beginAtZero:true,max:o.ymax,grid:{color:hair},border:{display:false},
        ticks:{callback:v=>yfmt(v),color:css('--muted'),maxTicksLimit:6}}}
  };
}
function bars(labels,sets,o={}){
  return {type:'bar',plugins:[marksPlugin],data:{labels,datasets:sets.map(s=>({label:s.label,data:s.data,
    backgroundColor:css(s.color),borderRadius:o.stacked?0:4,borderSkipped:false,
    borderColor:o.stacked?css('--surface'):'transparent',borderWidth:o.stacked?2:0,
    barPercentage:.82,categoryPercentage:.8}))},options:baseOpts(o)};
}
function lines(labels,sets,o={}){
  return {type:'line',plugins:[marksPlugin],data:{labels,datasets:sets.map(s=>({label:s.label,data:s.data,
    borderColor:css(s.color),backgroundColor:css(s.color),borderWidth:2,pointRadius:o.points?3:0,pointHoverRadius:5,
    pointBackgroundColor:css(s.color),pointBorderColor:css('--surface'),pointBorderWidth:2,
    stepped:s.stepped||false,borderDash:s.dash||[],tension:0}))},options:baseOpts(o)};
}
function monthLabels(list){
  return list.map((m,i)=>(i===0||m.month===0)?[MS[m.month].replace('.',''),String(m.year)]:MS[m.month].replace('.',''));
}
function batteryMarks(list){
  const items=[];
  parcList().filter(e=>e.type==='Batterie'&&e.date).forEach(e=>{
    const idx=list.findIndex(m=>m.key===e.date.slice(0,7));
    if(idx>=0){const [y,mo,d]=e.date.split('-').map(Number);const dim=new Date(y,mo,0).getDate();items.push({idx,frac:(d-1)/dim,label:'Batterie'})}
  });
  return items;
}

/* ---------- vues ---------- */
const ICONS={
 accueil:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
 mois:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
 projection:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>',
 rentabilite:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9.5h5M9 14.5h5M8 12h6"/></svg>',
 refresh:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>',
 simulation:'<svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
 donnees:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'};
const TABS=[['accueil','Accueil'],['mois','Mois'],['projection','Projection'],['rentabilite','Rentabilité'],['simulation','Simulation'],['donnees','Données']];

function emptyState(){
  if(S.err==='nodb'||S.err==='not_granted')return `<div class="card empty"><h2>Données indisponibles</h2><p>Le stockage du navigateur n'est pas accessible. Quitte la navigation privée, puis recharge l'appli.</p></div>`;
  return `<div class="card empty"><h2>Aucun mois saisi</h2><p>Ajoute les quatre chiffres de ton appli solaire pour voir tes courbes${syncOn()&&!S.user?', ou connecte-toi dans Données pour récupérer tes données':''}.</p><button class="btn primary" data-act="tab" data-tab="donnees">Saisir un mois</button></div>`;
}
function installInfo(){
  const today=new Date().toISOString().slice(0,10);
  const act=parcList().filter(e=>(e.type==='Panneaux'||e.type==='Batterie')&&e.date&&e.date<=today);
  const kwc=act.filter(e=>e.type==='Panneaux').reduce((a,e)=>a+e.cap,0);
  const kwh=act.filter(e=>e.type==='Batterie').reduce((a,e)=>a+e.cap,0);
  const cost=act.reduce((a,e)=>a+(e.cost||0),0);
  return {kwc,kwh,cost};
}
function missingMonths(ml){
  if(!ml.length)return [];
  const last=ml[ml.length-1],now=new Date();let y=last.year,m=last.month+1;const out=[];
  while(y<now.getFullYear()||(y===now.getFullYear()&&m<now.getMonth())){
    if(m>11){m=0;y++;continue}
    out.push({y,m});m++;if(out.length>24)break;
  }
  return out;
}
function measuredSavings(ml){
  const c=cfg();return ml.reduce((a,m)=>a+m.usage*c.prix+Math.max(0,m.prod-m.usage)*c.rachat,0);
}
/* Production d'avant la mesure de la consommation (settings/pre : {months:{'2025-04':kWh,...}}).
   Sans destination connue, l'économie est estimée au taux d'autoconsommation sans batterie. */
function preInfo(){
  const p=S.settings.pre,m=p&&p.months;
  if(!m||typeof m!=='object')return null;
  const keys=Object.keys(m).sort();if(!keys.length)return null;
  const kwh=keys.reduce((a,k)=>a+(+m[k]||0),0),c=cfg();
  const nm=k=>MOIS[+k.slice(5)-1];
  return {keys,kwh,eur:kwh*c.tauxBase*c.prix,from:keys[0],
    span:nm(keys[0])+(keys.length>1?' à '+nm(keys[keys.length-1]):'')+' '+keys[keys.length-1].slice(0,4)};
}
function preNote(pre){
  return ` Dont ${eur(pre.eur)} estimés pour ${pre.span} (${fmt(pre.kwh)} kWh produits avant la mesure de la consommation, comptés à ${pc(cfg().tauxBase)} d'autoconsommation).`;
}

function jours(c,p){
  const hp=TARIFS[5],kwh=tempoKwh(),nJR=22,cap=(parcList().find(e=>e.type==='Batterie')||{cap:0}).cap;
  const perDay=(kwh?kwh[5]:0)/nJR,cov=Math.min(perDay,cap),gain=nJR*cov*(hp[1]-c.prix);
  const hc=(TARIFS[0][1]+TARIFS[2][1])/2,cost=cov/.9*hc,forced=nJR*(cov*hp[1]-cost);
  return {perDay,cov,gain,forced,ratio:hp[1]/c.prix};
}

/* ---------- simulation : ton installation comparée à une variante (en mémoire, rien n'est enregistré) ---------- */
const simList=()=>parcList().filter(e=>(e.type==='Panneaux'||e.type==='Batterie')&&e.date);
const unitOf=e=>e.type==='Batterie'?'kWh':'kWc';
const frDay=d=>d.split('-').reverse().join('/');
function sim(){
  if(!S.sim){const off={};simList().forEach(e=>{if(e.type==='Batterie')off[e.id]=true});S.sim={off,extra:[]}}
  return S.sim;
}
function simRuns(){
  const ml=monthsList(),c=scenarioCfg(),cb=consoBase(ml),s=sim();
  const run=parc=>{
    const p=project(parc,c,cb,c.startYear);let bills=0;
    p.cum=p.rows.map(r=>{bills+=r.M;return parc.filter(e=>+e.date.slice(0,4)<=r.y).reduce((a,e)=>a+(e.cost||0),0)+bills});
    p.bills=bills;p.autoMoy=p.rows.reduce((a,r)=>a+r.G,0)/(p.rows.reduce((a,r)=>a+r.E,0)||1);
    return p;
  };
  const base=simList();
  return {a:run(base),b:run(base.filter(e=>!s.off[e.id]).concat(s.extra))};
}
function simSummary(a,b){
  const rows=a.rows,end=rows.length-1,n=rows.length,dInv=a.costAll-b.costAll;
  if(Math.abs(dInv)<1&&Math.abs(a.bills-b.bills)<1)return {net:0,pay:null,text:'La variante donne le même résultat que ton installation. Décoche un équipement ou ajoute-en un pour comparer.'};
  const hiA=dInv>=0,hi=hiA?a:b,lo=hiA?b:a,who=hiA?'Ton installation':'La variante';
  const net=lo.cum[end]-hi.cum[end];
  let k=-1;for(let i=0;i<=end;i++)if(hi.cum[i]>lo.cum[i]+.005)k=i;
  const pay=k<end?rows[k+1].y:null;
  let text=`${who} coûte ${eur(Math.abs(dInv))} de plus en équipements et réduit les factures de ${eur(lo.bills-hi.bills)} sur ${n} ans. `;
  text+=net>=0?`Le surcoût est remboursé en ${pay}, puis rapporte : gain net de ${eur(net)} jusqu'en ${rows[end].y}.`:`Le surcoût n'est pas remboursé avant ${rows[end].y} : perte nette de ${eur(-net)}.`;
  return {net:hiA?net:-net,pay,text};
}

let tt=0;

function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'Écriture refusée : seul le propriétaire peut modifier ces données.';
  if(c==='quota_exceeded')return 'Stockage plein, supprime d\'anciennes entrées.';
  if(c==='resource_exhausted')return 'Trop de requêtes, réessaie dans un instant.';
  return 'Enregistrement impossible, réessaie.';
}
async function put(path,data){
  if(!db){toast('Données indisponibles.');return false}
  try{await db.doc(path).set(data);toast('Enregistré');return true}catch(e){toast(errMsg(e));return false}
}
async function del(path){
  if(!db){toast('Données indisponibles.');return false}
  try{await db.doc(path).delete();toast('Supprimé');return true}catch(e){toast(errMsg(e));return false}
}

/* ---------- sauvegarde ---------- */
const BACKUP_DAYS=30;
const daysSince=iso=>iso?(Date.now()-Date.parse(iso))/86400000:Infinity;
const frDate=iso=>new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
function backupDue(){
  if(!db||S.user)return false;
  const b=db.backupInfo();
  return daysSince(b.last||b.since)>BACKUP_DAYS;
}
function backupLine(){
  const b=db?db.backupInfo():{};
  return b.last?`Dernière sauvegarde le ${frDate(b.last)}.`:'Aucune sauvegarde exportée pour l\'instant.';
}
async function exportBackup(){
  if(!db){toast('Données indisponibles.');return}
  const name='suivi-solaire-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([db.exportJSON()],name,{type:'application/json'});
  try{
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Sauvegarde Suivi solaire'});
    }else{
      const u=URL.createObjectURL(file),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
    }
  }catch(e){if(e&&e.name==='AbortError')return;console.error(e);toast('Export impossible.');return}
  db.markExported();toast('Sauvegarde exportée');render();
}
async function importBackup(input){
  const f=input.files&&input.files[0];input.value='';
  if(!f||!db)return;
  let txt,info;
  try{txt=await f.text()}catch(e){toast('Lecture du fichier impossible.');return}
  try{info=db.inspectBackup(txt)}catch(e){toast(e.message||'Fichier invalide.');return}
  const when=info.exportedAt?' du '+frDate(info.exportedAt):'';
  const mName=k=>MOIS[+k.slice(5)-1]+' '+k.slice(0,4);
  const parts=[];
  if(info.kind==='ajout'){
    if(info.months)parts.push(`ajouter ou corriger ${info.months>1?info.months+' mois':'1 mois'} (${info.keys.map(mName).join(', ')})`);
    if(info.parcN)parts.push(`mettre à jour ${info.parcN>1?info.parcN+' équipements':'1 équipement'}`);
    if(info.settingsN)parts.push(`mettre à jour ${info.settingsN>1?info.settingsN+' réglages':'1 réglage'}`);
  }
  const msg=info.kind==='ajout'&&(info.parcN||info.settingsN)?'Ce fichier va '+parts.join(', ')+'. Le reste de tes données ne change pas. Continuer ?'
    :info.kind==='ajout'&&!info.months?'Ce fichier ne contient rien à importer.'
    :info.kind==='ajout'?`Ajouter ${info.months>1?info.months+' mois':'1 mois'} : ${info.keys.map(mName).join(', ')} ?`+(info.replaced.length?` ${info.replaced.map(mName).join(', ')} ${info.replaced.length>1?'sont déjà saisis et seront remplacés':'est déjà saisi et sera remplacé'}.`:' Le reste de tes données ne change pas.')
    :`Remplacer les données actuelles par la sauvegarde${when} (${info.months} mois, ${info.parc} équipements) ?`;
  if(!confirm(msg))return;
  try{await db.importJSON(txt);S.scen=null;S.edit=null;S.confirmDel=null;toast('Sauvegarde importée')}catch(e){toast(e.code==='invalid_file'?e.message:errMsg(e))}
}

/* ---------- formulaires ---------- */
const $=id=>document.getElementById(id);
function fvals(){return {prod:num($('f-prod').value),usage:num($('f-usage').value),conso:num($('f-conso').value),reseau:num($('f-reseau').value)}}
function fcalc(){
  const out=$('fcheck');if(!out)return;
  const v=fvals();
  if([v.prod,v.usage,v.conso,v.reseau].some(isNaN)){out.textContent='';return}
  const at=1-v.reseau/v.conso,ac=v.usage/v.prod,gap=Math.abs((v.conso-v.reseau)-v.usage);
  let t=`Autoconsommation ${pc(ac,1)} · autosuffisance ${pc(at,1)} (à comparer avec les pourcentages de ton appli).`;
  if(gap>0.02*v.conso)t+=` Écart de ${fmt(gap,1)} kWh entre « usage perso » et « consommation − réseau » : vérifie les chiffres.`;
  out.textContent=t;
}
function fkey(){return keyOf(+$('f-y').value,+$('f-m').value)}
function fillMonth(){
  const cur=S.months[fkey()]||{};
  ['prod','usage','conso','reseau'].forEach(k=>$('f-'+k).value=cur[k]!=null?String(cur[k]).replace('.',','):'');
  $('f-note').value=cur.note||'';S.edit=fkey();S.confirmDel=null;fcalc();

document.addEventListener('click',async ev=>{

    if(ok)S.scen=null;
  }
  else if(a==='savemonth'){
    const v=fvals();
    if([v.prod,v.usage,v.conso,v.reseau].some(x=>isNaN(x)||x<0)){toast('Remplis les quatre chiffres.');return}
    const y=+$('f-y').value,m=+$('f-m').value,k=keyOf(y,m);
    const note=$('f-note').value.trim();
    const doc={year:y,month:m,prod:v.prod,usage:v.usage,conso:v.conso,reseau:v.reseau};if(note)doc.note=note;
    if(await put('months/'+k,doc)){S.edit=null;S.confirmDel=null;S.tab='accueil';render();window.scrollTo(0,0)}
  }
  else if(a==='delmonth'){
    const k=fkey();

    if(await del('months/'+k)){S.confirmDel=null;S.edit=null}
  }
  else if(a==='addeq'){
    const id='p'+Date.now().toString(36);
    await put('parc/'+id,{type:'Batterie',name:'Nouvel équipement',date:new Date().toISOString().slice(0,10),cap:5,unit:'kWh',deg:.02,cost:0});
  }
  else if(a==='saveeq'){
    const id=b.dataset.id,g=k=>$('e-'+id+'-'+k).value;
    const type=g('type'),cap=num(g('cap')),deg=num(g('deg')),cost=num(g('cost')||'0'),date=g('date');

    await put('parc/'+id,{type,name:g('name').trim(),date,cap,unit:type==='Batterie'?'kWh':'kWc',deg:deg/100,cost:isNaN(cost)?0:cost});
  }
  else if(a==='deleq'){
    const id=b.dataset.id;
    if(S.confirmDel!==id){S.confirmDel=id;b.textContent='Confirmer';return}
    if(await del('parc/'+id))S.confirmDel=null;
  }
  else if(a==='recal'){
    const l=last12(monthsList());
    if(l.length<12){toast('Il faut 12 mois saisis.');return}
    const kwc=parcList().filter(e=>e.type==='Panneaux').reduce((s,e)=>s+e.cap,0);

    $('s-ratio').value=String(Math.round(l.reduce((s,m)=>s+m.prod,0)/kwc)).replace('.',',');

  }
  else if(a==='simpreset'){const s=sim();s.off={};s.extra=[];if(b.dataset.v==='nobat')simList().forEach(e=>{if(e.type==='Batterie')s.off[e.id]=true});render()}
  else if(a==='simdel'){sim().extra.splice(+b.dataset.i,1);render()}
  else if(a==='simadd'){
    const type=$('sx-type').value,cap=num($('sx-cap').value),cost=num($('sx-cost').value||'0'),date=$('sx-date').value;
    if(isNaN(cap)||cap<=0||!date){toast('Date et capacité sont obligatoires.');return}
    const unit=type==='Batterie'?'kWh':'kWc';
    sim().extra.push({id:'x'+Date.now().toString(36),type,date,cap,unit,deg:type==='Batterie'?.02:.005,cost:isNaN(cost)?0:cost,
      name:(type==='Batterie'?'Batterie fictive ':'Panneaux fictifs ')+fmt(cap,2)+' '+unit});
    render();
  }
  else if(a==='login'||a==='signup'){
    const email=$('au-email').value.trim(),pw=$('au-pw').value;
    if(!email||!pw){toast("Remplis l'e-mail et le mot de passe.");return}
    b.disabled=true;
    try{
      if(a==='login'){await SolarSync.signIn(email,pw);toast('Connecté, synchronisation…')}
      else{const r=await SolarSync.signUp(email,pw);toast(r&&r.session?'Compte créé, synchronisation…':'Compte créé : clique le lien reçu par e-mail, puis connecte-toi.')}
    }catch(e){toast(SolarSync.authMessage(e))}
    b.disabled=false;
  }
  else if(a==='logout'){await SolarSync.signOut();toast('Déconnecté. Tes données restent sur cet appareil.')}
  else if(a==='syncnow'){await db.sync();const s=db.syncStatus();toast(s.state==='ok'?'Synchronisé':syncLine())}
  else if(a==='export')exportBackup();
  else if(a==='swupdate'||a==='refresh')refreshApp(b);
  else if(a==='import')$('imp-file').click();
  else if(a==='savecfg'){
    const g=k=>num($('s-'+k).value),o={};
    const keys=['ratio','tauxBase','bonus','plafond','startYear','prix','abo','rachat','priceGrowth','consoGrowth'];
    const pcts=['tauxBase','bonus','plafond','priceGrowth','consoGrowth'];
    for(const k of keys){const v=g(k);if(isNaN(v)){toast('Un champ n\'est pas un nombre.');return}o[k]=pcts.includes(k)?v/100:v}
    if(await put('settings/main',o))S.scen=null;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target,a=t.dataset&&t.dataset.act;
  if(a==='fcalc')fcalc();
  else if(a==='scen'){
    const s=scen(),k=t.dataset.k,v=+t.value;
    s[k]=k==='rachat'?v/100:v/100;
    const lab=$('sc-'+k+'-v');
    if(lab)lab.textContent=k==='rachat'?fmt(v,0)+' c€/kWh':'+'+fmt(v,1)+' %';
    clearTimeout(window.__st);window.__st=setTimeout(()=>{updateResults();const b=document.querySelector('[data-act=scensave]');if(b)b.disabled=JSON.stringify(s)===JSON.stringify({priceGrowth:cfg().priceGrowth,consoGrowth:cfg().consoGrowth,rachat:cfg().rachat})},120);
  }
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset&&ev.target.dataset.act==='fsel')fillMonth();
  else if(ev.target.id==='imp-file')importBackup(ev.target);
  else if(ev.target.dataset&&ev.target.dataset.act==='simtoggle'){sim().off[ev.target.dataset.id]=!ev.target.checked;render()}
});

/* thème : redessine les graphiques quand le thème change */
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>schedule())}catch(e){}
new MutationObserver(()=>schedule()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- synchronisation entre appareils (Supabase) ---------- */
const syncOn=()=>!!(window.SolarSync&&SolarSync.available());
function syncLine(){
  const s=S.sync||{},p=s.pending||0,att=p?' · '+p+' modification'+(p>1?'s':'')+' en attente':'';
  if(s.state==='syncing')return 'Synchronisation…';
  if(s.state==='ok')return 'Synchronisé à '+new Date(s.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+att+'.';
  if(s.state==='offline')return 'Hors ligne'+att+' : envoi au retour du réseau.';
  if(s.state==='error')return "Synchronisation impossible pour l'instant"+att+". Nouvel essai au prochain retour dans l'appli.";
  return '';
}
function syncCard(){
  if(!syncOn())return '';
  if(S.user)return `<section class="card"><h2>Synchronisation</h2>
    <p class="sub">Connecté avec <b style="color:var(--ink)">${esc(S.user.email)}</b>. Tes données se synchronisent entre tes appareils.</p>
    <p class="sub" id="sync-status" role="status">${esc(syncLine())}</p>
    <div class="row2"><button class="btn primary" data-act="syncnow">Synchroniser maintenant</button><button class="btn" data-act="logout">Se déconnecter</button></div></section>`;
  return `<section class="card"><h2>Synchronisation</h2>
    <p class="sub">Connecte-toi pour retrouver tes données sur l'iPhone et l'iPad. Sans connexion, elles restent seulement sur cet appareil.</p>
    <div class="field"><label for="au-email">E-mail</label><input id="au-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label for="au-pw">Mot de passe</label><input id="au-pw" type="password" autocomplete="current-password"><small>6 caractères minimum.</small></div>
    <div class="row2"><button class="btn primary" data-act="login">Se connecter</button><button class="btn" data-act="signup">Créer mon compte</button></div></section>`;
}
function startSync(){
  if(!syncOn())return;
  db.onSync(st=>{S.sync=st;const el=$('sync-status');if(el)el.textContent=syncLine()});
  SolarSync.onAuth(user=>{
    const was=S.user&&S.user.id,now=user&&user.id;
    S.user=user;
    if(was!==now){if(user)db.attachRemote(SolarSync.adapter(user.id),user.id);else db.detachRemote();schedule()}
  });
  addEventListener('online',()=>{if(S.user)db.sync()});
  let last=Date.now();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&S.user&&Date.now()-last>30e3){last=Date.now();db.sync()}
  });
}

/* ---------- démarrage ---------- */
async function boot(){
  render();
  try{db=await SolarStore.open()}catch(e){console.error(e);db=null}
  if(!db){S.err='nodb';render();return}
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[key]=o;S.loaded[key]=true;schedule();
  },e=>{S.err=(e&&e.code)||'unavailable';schedule()});
  sub('months','months');sub('parc','parc');sub('settings','settings');
  startSync();
}
boot();

/* ---------- mise à jour de l'appli ----------
   La nouvelle version attend dans le service worker ; un bandeau propose de l'activer. */
let swReg=null,swReload=false;
/* Actualiser : cherche une nouvelle version, l'active s'il y en a une, sinon recharge simplement la page. */
async function refreshApp(btn){
  if(btn)btn.disabled=true;
  try{sessionStorage.setItem('ss-refreshed','1')}catch(e){}
  if(!swReg){location.reload();return}
  toast('Recherche d\'une mise à jour…');
  try{await swReg.update()}catch(e){}
  const w=swReg.installing;
  if(w&&!swReg.waiting)await new Promise(r=>{
    const t=setTimeout(r,15000);
    w.addEventListener('statechange',()=>{if(w.state==='installed'||w.state==='redundant'){clearTimeout(t);r()}});
  });
  if(swReg.waiting&&navigator.serviceWorker.controller){swReload=true;swReg.waiting.postMessage('skipWaiting');return}
  location.reload();
}
try{if(sessionStorage.getItem('ss-refreshed')){sessionStorage.removeItem('ss-refreshed');setTimeout(()=>toast('Appli à jour, version '+APP_VERSION),400)}}catch(e){}
function showUpdate(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.id='upd';d.setAttribute('role','status');
  d.innerHTML='<span>Nouvelle version disponible.</span><button class="btn small primary" data-act="swupdate">Mettre à jour</button>';
  document.body.appendChild(d);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReload)location.reload()});
  addEventListener('load',async()=>{
    try{
      swReg=await navigator.serviceWorker.register('sw.js');
      const watch=w=>{if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})};
      if(swReg.waiting&&navigator.serviceWorker.controller)showUpdate();
      watch(swReg.installing);
      swReg.addEventListener('updatefound',()=>watch(swReg.installing));
      /* l'appli reste souvent ouverte en arrière-plan sur iPhone : vérifier au retour, au plus toutes les 15 min */
      let last=Date.now();
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible'&&Date.now()-last>15*60e3){last=Date.now();swReg.update().catch(()=>{})}
      });
    }catch(e){console.error(e)}
  });
}
